name: Package

# Builds the Windows app and the Linux Flatpak on GitHub's machines.
# Run by hand (Actions tab > Package > Run workflow) or by pushing a v* tag,
# which also attaches both files to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: C:\Qt
          key: qt-6.11.2-msvc2022_64
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python packaging/install-qt-windows.py C:\Qt 6.11.2
      - name: Put Qt on PATH
        shell: bash
        run: |
          qmake=$(find /c/Qt -name qmake.exe -path '*/bin/*' | head -1)
          echo "$(dirname "$qmake")" >> "$GITHUB_PATH"
          echo "QMAKE=$(cygpath -w "$qmake")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      # PowerShell, not bash: Git Bash's own `link` shadows MSVC's link.exe.
      - name: Build
        run: |
          rc -nologo -fo spinwave.res packaging/windows/spinwave.rc
          cargo rustc --release --locked --bin spinwave -- -C link-arg=spinwave.res
      - name: Bundle
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/spinwave.exe dist/
          cp -r qml dist/qml
          bash packaging/fetch-fonts.sh dist/fonts
          windeployqt --release --qmldir dist/qml dist/spinwave.exe
          7z a Spinwave-windows-x64.zip ./dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwave-windows-x64
          path: Spinwave-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Spinwave-windows-x64.zip

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # Keeps the built Qt modules; only the app rebuilds when Qt is unchanged.
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('packaging/flatpak/*.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-${{ hashFiles('packaging/flatpak/*.yml') }}-
            flatpak-
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build \
            packaging/flatpak/io.github.shadrous.Spinwave.yml
          flatpak build-bundle repo Spinwave-linux-x86_64.flatpak io.github.shadrous.Spinwave
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwave-linux-x86_64-flatpak
          path: Spinwave-linux-x86_64.flatpak
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Spinwave-linux-x86_64.flatpak
