name: Package

# Builds the Windows app and the Linux Flatpak on GitHub's machines.
# Run by hand (Actions tab > Package > Run workflow) or by pushing a v* tag,
# which also attaches both files to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          arch: win64_msvc2022_64
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Bundle
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/spinwave.exe dist/
          cp -r qml dist/qml
          bash packaging/fetch-fonts.sh dist/fonts
          windeployqt --release --qmldir dist/qml dist/spinwave.exe
          7z a Spinwave-windows-x64.zip ./dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwave-windows-x64
          path: Spinwave-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Spinwave-windows-x64.zip

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Available KDE SDKs
        run: flatpak remote-ls --user flathub --runtime --columns=application,branch | grep -E '^org\.kde\.Sdk\s' || true
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build \
            packaging/flatpak/io.github.shadrous.Spinwave.yml
          flatpak build-bundle repo Spinwave-linux-x86_64.flatpak io.github.shadrous.Spinwave
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwave-linux-x86_64-flatpak
          path: Spinwave-linux-x86_64.flatpak
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Spinwave-linux-x86_64.flatpak
