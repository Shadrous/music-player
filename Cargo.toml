[package]
name = "spinwave"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
qtbridge = "=0.2.0"
cxx = "1"
linkme = "0.3"
# P1 (user-approved): InnerTube client + HTTP + secrets. Float versions only.
ytmusic-rs = "0.1"
# P3 (user-approved): audio playback. Float versions only.
rodio = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# User-approved 2026-10-25: OS media controls (MPRIS on Linux, SMTC on
# Windows, Now Playing on macOS). zbus backend: no libdbus headers needed.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[build-dependencies]
cxx-build = "1"
qtbridge-build-utils = "=0.2.0"

# Windows browser sign-in (user-approved 2026-10-25): an Edge WebView2 window
# (wry) on tao's event loop. Windows-only; Linux uses the WebKitGTK helper.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }
tao = "0.37"
